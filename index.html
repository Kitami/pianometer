<html>

<head>
    <meta charset="UTF-8">
    <title>響鋼琴鍵盤顯示器</title>
    <link rel="stylesheet" href="style.css">
    <script src="p5.min.js"></script>
    <script src="tonal.min.js"></script>
    <script src="webmidi.js"></script>
    <script src="globals.js"></script>
    <script src="piano-visualizer.js"></script>
    <script src="https://unpkg.com/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
    <style>
        #music-container {
            display: none;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="controls" class="center">
            <div>
                <div style="display: flex; justify-content: space-around;">
                    <div>
                        <h5>選擇 MIDI 裝置</h5>
                        <select id="midi-select" onchange="inputChanged()"></select>
                        <div id="device">Select Input: </div>
                    </div>
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: start;">
                        <div>
                            <label for="colorpicker">選擇顏色</label>
                            <input type="color" id="colorpicker" value="#ff0090" oninput="changeColor()">
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span style="margin-right: 5px;">顯示音名</span>
                            <input type="checkbox" id="display-note-names-checkbox" onclick="toggleDisplayNoteNames(this)">
                            <label for="display-note-names-checkbox">
                                <span class="switch-txt" turnOn="On" turnOff="Off"></span>
                            </label>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span style="margin-right: 5px;">顯示樂譜</span>
                            <button id="displaySheet" onclick="toggleDisplaySheet(this)">
                        </div>
                    </div>
                </div>
            </div>
            <div id="music-container">
                <p id="instructions">Drop your MusicXML file here</p>
            </div>
        </div>
    </div>
    <div class="centerbottom">
        <div id="piano-visualizer">
            <!-- Our sketch will go here! -->
        </div>
    </div>  
</body>
</html>
